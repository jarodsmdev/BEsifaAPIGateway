name: Build and Deploy Gateway

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Export secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler secrets download \
            --no-file \
            --format json | jq -r '
              to_entries[]
              | "\(.key)<<EOF\n\(.value)\nEOF"
            ' >> $GITHUB_ENV

      # Falla rápido si faltan secretos en Doppler: sin ellos Spring no puede
      # resolver los placeholders y el contenedor moriría en el arranque.
      - name: Verify required secrets
        run: |
          missing=0
          for v in JWT_SECRET JWT_ISSUER JWT_AUDIENCE \
                   INTERNAL_JWT_SECRET INTERNAL_JWT_ISSUER INTERNAL_JWT_AUDIENCE \
                   INTERNAL_CHANNEL_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto '$v' en Doppler"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t jarodsm/sifa-gateway:latest .

      - name: Push Docker image
        run: |
          docker push jarodsm/sifa-gateway:latest

      - name: Generate runtime env
        run: |
          cat > gateway.env <<EOF
          APP_NAME=${APP_NAME}
          SERVER_PORT=9000
          JWT_SECRET=${JWT_SECRET}
          JWT_ISSUER=${JWT_ISSUER}
          JWT_AUDIENCE=${JWT_AUDIENCE}
          INTERNAL_JWT_SECRET=${INTERNAL_JWT_SECRET}
          INTERNAL_JWT_ISSUER=${INTERNAL_JWT_ISSUER}
          INTERNAL_JWT_AUDIENCE=${INTERNAL_JWT_AUDIENCE}
          INTERNAL_CHANNEL_KEY=${INTERNAL_CHANNEL_KEY}
          AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
          PLATE_SERVICE_URL=${PLATE_SERVICE_URL}
          CORE_SERVICE_URL=${CORE_SERVICE_URL}
          SPRINGDOC_API_DOCS_ENABLED=${SPRINGDOC_API_DOCS_ENABLED}
          SPRINGDOC_SWAGGER_UI_ENABLED=${SPRINGDOC_SWAGGER_UI_ENABLED}
          EOF

      - name: Copy env file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          source: "gateway.env"
          target: "/tmp"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            set -e

            trap "rm -f /tmp/gateway.env" EXIT

            echo "Pulling latest image..."
            docker pull jarodsm/sifa-gateway:latest

            echo "Stopping old container..."
            docker rm -f sifa-gateway || true

            echo "Starting new container..."
            docker run -d \
              -p 80:9000 \
              --restart unless-stopped \
              --env-file /tmp/gateway.env \
              --name sifa-gateway \
              jarodsm/sifa-gateway:latest

            echo "Verifying deployment..."
            code=000
            for i in $(seq 1 12); do
              sleep 10
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                http://localhost:9000/ 2>/dev/null || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                break
              fi
            done

            if [ -z "$code" ] || [ "$code" = "000" ]; then
              echo "::error::El gateway no responde en localhost:9000"
              docker logs --tail 100 sifa-gateway 2>&1 || true
              exit 1
            fi

            echo "Gateway responde con HTTP $code"