spring.application.name=${APP_NAME:gateway}
server.port=${SERVER_PORT:9000}
jwt.secret=${JWT_SECRET}
# Claims estándar para validación defense-in-depth
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

# Secreto interno para el token X-Auth-Identity (JWT de corta duración hacia los servicios downstream)
jwt.internal.secret=${INTERNAL_JWT_SECRET}
jwt.internal.issuer=${INTERNAL_JWT_ISSUER}
jwt.internal.audience=${INTERNAL_JWT_AUDIENCE}

# Firma del canal interno: el gateway la adjunta a cada petición reenviada y
# auth/core/plate la exigen. Vacío = canal sin validar (ver ChannelKeyFilter).
internal.channel.key=${INTERNAL_CHANNEL_KEY:}

# Spring Cloud Gateway
# Los índices de routes[] deben ser contiguos: al insertar o eliminar una ruta
# hay que renumerar el resto, porque Spring enlaza la propiedad como List y un
# hueco deja un null que provoca un NPE al montar el RouteDefinition.
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://auth-api:8080}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/api/v1/**

spring.cloud.gateway.routes[1].id=plate-service
spring.cloud.gateway.routes[1].uri=${PLATE_SERVICE_URL:http://plate-api:8000}
spring.cloud.gateway.routes[1].predicates[0]=Path=/plate/api/v1/**

spring.cloud.gateway.routes[2].id=mock-service
spring.cloud.gateway.routes[2].uri=http://localhost:8000
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/mock/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/mock/(?<segment>.*), /$\\{segment}

# Ruta comodín de core. Su order=1 la evalúa después de las rutas dedicadas de
# APK y backups (order=0), que sin ese desempate perderían la partida.
spring.cloud.gateway.routes[3].id=core-service
spring.cloud.gateway.routes[3].order=1
spring.cloud.gateway.routes[3].uri=${CORE_SERVICE_URL:http://core-sifa:8080}
spring.cloud.gateway.routes[3].predicates[0]=Path=/core/api/v1/**

# Rutas dedicadas a los metadatos de Swagger (con RewritePath)
spring.cloud.gateway.routes[4].id=auth-swagger-docs
spring.cloud.gateway.routes[4].uri=${AUTH_SERVICE_URL:http://auth-api:8080}
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/auth/(?<segment>.*), /$\\{segment}

spring.cloud.gateway.routes[5].id=core-swagger-docs
spring.cloud.gateway.routes[5].uri=${CORE_SERVICE_URL:http://core-sifa:8080}
spring.cloud.gateway.routes[5].predicates[0]=Path=/core/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/core/(?<segment>.*), /$\\{segment}

spring.cloud.gateway.routes[6].id=plate-swagger-docs
spring.cloud.gateway.routes[6].uri=${PLATE_SERVICE_URL:http://plate-api:8000}
spring.cloud.gateway.routes[6].predicates[0]=Path=/plate/openapi.json
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/plate/(?<segment>.*), /$\\{segment}

# Rutas con timeout largo (order=0, se evalúan antes que core-service)
spring.cloud.gateway.routes[7].id=core-apk-upload
spring.cloud.gateway.routes[7].order=0
spring.cloud.gateway.routes[7].uri=${CORE_SERVICE_URL:http://core-sifa:8080}
spring.cloud.gateway.routes[7].predicates[0]=Path=/core/api/v1/apk/upload
spring.cloud.gateway.routes[7].metadata.response-timeout=120000

spring.cloud.gateway.routes[8].id=core-backup-download
spring.cloud.gateway.routes[8].order=0
spring.cloud.gateway.routes[8].uri=${CORE_SERVICE_URL:http://core-sifa:8080}
spring.cloud.gateway.routes[8].predicates[0]=Path=/core/api/v1/admin/backups/*/download
spring.cloud.gateway.routes[8].metadata.response-timeout=180000

spring.cloud.gateway.routes[9].id=core-backup-upload-restore
spring.cloud.gateway.routes[9].order=0
spring.cloud.gateway.routes[9].uri=${CORE_SERVICE_URL:http://core-sifa:8080}
spring.cloud.gateway.routes[9].predicates[0]=Path=/core/api/v1/admin/backups/**
spring.cloud.gateway.routes[9].metadata.response-timeout=300000


# ============================================================================
# CENTRALIZACIÓN DE SWAGGER UI EN EL GATEWAY
# ============================================================================
springdoc.swagger-ui.urls[0].name=1. Servicio de Autenticación (Auth)
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=2. Servicio de Negocio (Core)
springdoc.swagger-ui.urls[1].url=/core/v3/api-docs

springdoc.swagger-ui.urls[2].name=2. Servicio de IA (Plate Detector)
springdoc.swagger-ui.urls[2].url=/plate/openapi.json

# --- CONTROL DE EXPOSICIÓN POR ENTORNO ---
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# CORS global (DEV flexible)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# Orígenes permitidos explícitos (no usar * con allow-credentials=true)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[2]=https://sifacore.netlify.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[3]=https://sifacore2.netlify.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[4]=http://sifacore.s3-website-us-east-1.amazonaws.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[5]=https://sifacore.s3.us-east-1.amazonaws.com

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[1]=Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[2]=X-Requested-With
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[3]=X-Client-Origin

spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600


# Disable default Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

# ============================================================================
# RATE LIMITING (Sliding window por IP + ruta)
# Igual que con routes[], los índices de rules[] deben ser contiguos:
# RateLimitingFilter itera la lista y RateLimitConfig hace get(i), así que un
# hueco produciría un NPE.
# ============================================================================
rate-limit.rules[0].path-pattern=/auth/api/v1/**
rate-limit.rules[0].max-requests=100
rate-limit.rules[0].window-seconds=60

rate-limit.rules[1].path-pattern=/plate/api/v1/**
rate-limit.rules[1].max-requests=100
rate-limit.rules[1].window-seconds=60

rate-limit.rules[2].path-pattern=/core/api/v1/**
rate-limit.rules[2].max-requests=100
rate-limit.rules[2].window-seconds=60

rate-limit.rules[3].path-pattern=/swagger-ui/**
rate-limit.rules[3].max-requests=100
rate-limit.rules[3].window-seconds=60

rate-limit.rules[4].path-pattern=/**/v3/api-docs
rate-limit.rules[4].max-requests=100
rate-limit.rules[4].window-seconds=60

rate-limit.rules[5].path-pattern=/**
rate-limit.rules[5].max-requests=200
rate-limit.rules[5].window-seconds=60

# ============================================================================
# DDOS PROTECTION
# ============================================================================
spring.cloud.gateway.request-size.max-size=300MB
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.codec.max-in-memory-size=512MB
