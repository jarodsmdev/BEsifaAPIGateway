spring.application.name=${APP_NAME:gateway}
server.port=${SERVER_PORT:9000}
jwt.secret=${JWT_SECRET}

# Spring Cloud Gateway
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://auth-api:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/api/v1/**

spring.cloud.gateway.server.webflux.routes[1].id=plate-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PLATE_SERVICE_URL:http://localhost:8001}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/plate/**

spring.cloud.gateway.server.webflux.routes[2].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[2].uri=${DASHBOARD_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/dashboard/**

spring.cloud.gateway.server.webflux.routes[4].id=core-service
spring.cloud.gateway.server.webflux.routes[4].uri=${CORE_SERVICE_URL:http://core-sifa:8080}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/core/api/v1/**

spring.cloud.gateway.server.webflux.routes[3].id=mock-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8000
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/mock/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/mock/(?<segment>.*), /$\\{segment}


# CORS global (DEV flexible)
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

# IMPORTANTE: usar patterns (no allowed-origins)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=*

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[1]=Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[2]=X-Requested-With

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600


# Disable default Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration