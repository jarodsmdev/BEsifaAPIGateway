services:
  gateway:
    build: .
    container_name: gateway
    ports:
      # Solo loopback: en producción el gateway es el único con IP pública
      # (ver deploy_SIFA-GATEWAY.sh).
      - "127.0.0.1:9000:9000"
    env_file:
      - .env
    networks:
      - sifa-network  # ← Usar red externa

networks:
  sifa-network:
    external: true  # ← Indicar que es externa
